name: flow_ui
description: Flow UI is an open-source Flutter UI library to build production-grade Chat & AI assistant interfaces.
version: 0.2.0
homepage: https://flowui.stac.dev/
repository: https://github.com/StacDev/flow_ui
issue_tracker: https://github.com/StacDev/flow_ui/issues
documentation: https://flowui.stac.dev/
topics:
  - ai
  - chat
  - chatbot
  - assistant
  - ui

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Figtree is the typeface of the Flow UI design file, and Geist Mono its
  # code face. Both ship with the package (SIL Open Font License, see
  # fonts/OFL.txt and fonts/OFL-GeistMono.txt) so the default theme renders
  # as designed without the host bundling a font — and without a font
  # dependency.
  #
  # Static instances rather than the variable TTFs: Flutter maps FontWeight
  # to the nearest declared weight, so a weight axis would not be
  # interpolated. Geist Mono carries only the three weights the mono roles
  # reach for, to keep what every host app inherits small.
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Light.ttf
          weight: 300
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
        - asset: fonts/Figtree-ExtraBold.ttf
          weight: 800
        - asset: fonts/Figtree-Black.ttf
          weight: 900
    - family: GeistMono
      fonts:
        - asset: fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: fonts/GeistMono-SemiBold.ttf
          weight: 600

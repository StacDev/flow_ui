name: flow_ui
description: Flow UI is an open-source Flutter UI library to build production-grade Chat & AI assistant interfaces.
version: 0.2.0
homepage: https://flowui.stac.dev/
repository: https://github.com/StacDev/flow_ui
issue_tracker: https://github.com/StacDev/flow_ui/issues
documentation: https://flowui.stac.dev/
topics:
  - ai
  - chat
  - chatbot
  - assistant
  - ui

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Google Sans is the typeface of the Flow UI design file, and Google Sans
  # Code its code face. Both ship with the package (SIL Open Font License,
  # see fonts/OFL-GoogleSans.txt and fonts/OFL-GoogleSansCode.txt) so the
  # default theme renders as designed without the host bundling a font —
  # and without a font dependency.
  #
  # Static instances rather than the variable TTFs: Flutter maps FontWeight
  # to the nearest declared weight, so a weight axis would not be
  # interpolated. Google Sans carries the four weights the type scale and
  # the playground chrome reach for; Google Sans Code is small enough to
  # carry all five of its cuts.
  fonts:
    - family: GoogleSans
      fonts:
        - asset: fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: GoogleSansCode
      fonts:
        - asset: fonts/GoogleSansCode-Light.ttf
          weight: 300
        - asset: fonts/GoogleSansCode-Regular.ttf
          weight: 400
        - asset: fonts/GoogleSansCode-Medium.ttf
          weight: 500
        - asset: fonts/GoogleSansCode-SemiBold.ttf
          weight: 600
        - asset: fonts/GoogleSansCode-Bold.ttf
          weight: 700

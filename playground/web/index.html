<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Interactive playground for flow_ui — chat and assistant UI components for Flutter.">

  <!-- Social preview -->
  <meta property="og:title" content="Flow UI Playground · Flutter UI library for AI Chat Interfaces">
  <meta property="og:description" content="Interactive playground for flow_ui — chat and assistant UI components for Flutter.">
  <meta property="og:url" content="https://flowui.stac.dev/playground/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Flow UI">
  <meta property="og:image" content="https://flowui.stac.dev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@stac_dev">
  <meta name="twitter:image" content="https://flowui.stac.dev/og.png">
  <link rel="canonical" href="https://flowui.stac.dev/playground/">

  <!-- Pre-paint the page in the requested theme's surface color
       (FlowColors.dark/.light surface) so embedded iframes never flash
       white while the engine boots. -->
  <script>
    var t = new URLSearchParams(location.search).get('theme');
    document.documentElement.style.background =
      t === 'dark' ? '#171717' : '#F9F9F7';
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flow UI Playground">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flow UI Playground · Flutter UI library for AI Chat Interfaces</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
